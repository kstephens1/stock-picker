name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Run tests
        run: npm run test:unit

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build client with production API URL
        run: cd client && npm run build
        env:
          REACT_APP_API_BASE_URL: ${{ secrets.BACKEND_URL }}
          CI: true

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy backend to Compute Engine
        run: |
          echo "${{ secrets.VM_DEPLOY_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no -r server/ kstephens1_gmail_com@35.211.52.83:/tmp/stockpicker-update
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no kstephens1_gmail_com@35.211.52.83 "cd /tmp/stockpicker-update && npm install --production && sudo systemctl restart stock-picker"
          rm /tmp/deploy_key

      - name: Run smoke tests against production
        run: npm run test:e2e:prod
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.FRONTEND_URL }}

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              description: 'Deployment successful',
              auto_merge: false,
              required_contexts: []
            });

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: e2e/playwright-report/
          retention-days: 30
