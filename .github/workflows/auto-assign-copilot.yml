name: Auto-Assign Copilot

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  assign-copilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Assign Copilot on issue open
        if: github.event_name == 'issues' && contains(github.event.issue.body, '@copilot')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['copilot']
            });
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 **Copilot Assignment Active**\n\nThis issue has been assigned to @copilot for autonomous implementation. Open this issue in **GitHub Copilot Workspace** to:\n\n1. Review the proposed technical plan\n2. Edit the plan\'s natural language steps\n3. Generate and implement the code\n4. Automatically run tests\n5. Open a Pull Request\n\n**Mobile First:** Tap "Open in Workspace" from the GitHub Mobile App to begin.'
            });

      - name: Assign Copilot on PR
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.body, '@copilot')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['copilot']
            });
